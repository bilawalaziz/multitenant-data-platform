name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.0.1
      - name: Run pre-commit hooks
        # The Java format check runs in the build job as part of mvn verify.
        env:
          SKIP: spotless
        run: pre-commit run --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pin the Docker API version for Testcontainers
        run: printf 'api.version=1.44\n' > ~/.docker-java.properties
      # The wrapper downloads Maven on first use; retry so a transient download error does not fail the build.
      - name: Download Maven via the wrapper
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -ntp --version && exit 0
            echo "Maven download failed (attempt $attempt), retrying in 10s"
            sleep 10
          done
          exit 1
      - run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

  consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The tests import the OpenTelemetry SDK, so they need the same pinned packages as the image.
      - run: pip install -r consumer/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s consumer -v
      - run: python -m py_compile scripts/demo.py

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example config -q
      - run: docker build -t sensor-ingestion-platform:ci .
      - run: docker build -t sensor-consumer:ci consumer
      - name: Validate Prometheus config and alert rules
        run: |
          promtool() { docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus":/etc/prometheus:ro prom/prometheus:v3.5.0 "$@"; }
          promtool check config /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/alerts.yml
          promtool test rules /etc/prometheus/alerts.test.yml
      # Fails the build on any fixable critical finding. Accepted exceptions are listed in .trivyignore.
      - name: Check fixable critical vulnerabilities in the application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          image-ref: sensor-ingestion-platform:ci
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
      - name: Report critical and high findings in the application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          image-ref: sensor-ingestion-platform:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - name: Scan repository dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
