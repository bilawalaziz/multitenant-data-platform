version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      maven-patches:
        update-types: [patch]
  - package-ecosystem: pip
    directory: /consumer
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  # The runtime and build images stay on the Java 17 LTS line; moving to another Java version is a deliberate change.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      # Tags like 3.9.9-eclipse-temurin-17 encode the JDK in a suffix that Dependabot treats as part of the version.
      - dependency-name: maven
  - package-ecosystem: docker
    directory: /consumer
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
