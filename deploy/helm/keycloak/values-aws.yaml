# Replace the REPLACE_* values with the Terraform outputs of deploy/terraform/envs/aws.
hostname: https://keycloak.REPLACE_DOMAIN
replicas: 2
clustering:
  enabled: true
db:
  host: REPLACE_RDS_ADDRESS # output rds_address
  port: 5432
  name: keycloak
  sslmode: require
externalSecrets:
  refreshInterval: 1h
resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {memory: 1536Mi}
javaOptsKcHeap: "-Xms512m -Xmx1g"
ingress:
  enabled: true
  className: alb
  hosts: [keycloak.REPLACE_DOMAIN]
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/security-groups: REPLACE_ALB_SECURITY_GROUP_ID
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-port: "9000"
    alb.ingress.kubernetes.io/success-codes: "200"
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels: {app.kubernetes.io/name: keycloak}
