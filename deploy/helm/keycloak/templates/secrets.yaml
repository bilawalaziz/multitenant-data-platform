{{- $es := .Values.externalSecrets }}
{{- if $es.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  labels:
    {{- include "kc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.storeRef | nindent 4 }}
  target: {name: keycloak-secrets, creationPolicy: Owner}
  data:
    - secretKey: KC_BOOTSTRAP_ADMIN_USERNAME
      remoteRef: {key: {{ $es.prefix }}/keycloak/admin, property: username}
    - secretKey: KC_BOOTSTRAP_ADMIN_PASSWORD
      remoteRef: {key: {{ $es.prefix }}/keycloak/admin, property: password}
    - secretKey: KC_DB_USERNAME
      remoteRef: {key: {{ $es.prefix }}/db/keycloak, property: username}
    - secretKey: KC_DB_PASSWORD
      remoteRef: {key: {{ $es.prefix }}/db/keycloak, property: password}
    - secretKey: PROVISIONER_CLIENT_SECRET
      remoteRef: {key: {{ $es.prefix }}/keycloak/provisioner, property: client_secret}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  labels:
    {{- include "kc.labels" . | nindent 4 }}
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ required "plainSecrets.ADMIN_USER is required" .Values.plainSecrets.ADMIN_USER | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "plainSecrets.ADMIN_PASSWORD is required" .Values.plainSecrets.ADMIN_PASSWORD | quote }}
  KC_DB_USERNAME: {{ required "plainSecrets.DB_USER is required" .Values.plainSecrets.DB_USER | quote }}
  KC_DB_PASSWORD: {{ required "plainSecrets.DB_PASSWORD is required" .Values.plainSecrets.DB_PASSWORD | quote }}
  PROVISIONER_CLIENT_SECRET: {{ required "plainSecrets.PROVISIONER_CLIENT_SECRET is required" .Values.plainSecrets.PROVISIONER_CLIENT_SECRET | quote }}
{{- end }}
{{- if .Values.realmSecrets.generate }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "keycloak-realm-secrets" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-realm-secrets
  labels:
    {{- include "kc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.realmSecrets.keys }}
  {{- $value := "" }}
  {{- if and $existing $existing.data (hasKey $existing.data .) }}
  {{- $value = index $existing.data . | b64dec }}
  {{- else }}
  {{- $value = randAlphaNum 32 }}
  {{- end }}
  {{ . }}: {{ $value | quote }}
  {{- end }}
{{- end }}
