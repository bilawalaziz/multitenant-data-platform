{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  labels:
    {{- include "ld.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka
data:
  # Single KRaft node. CLIENT requires SASL/SCRAM-SHA-512 (what MSK offers on 9096, without TLS here); BROKER and
  # CONTROLLER are plaintext and only used inside the pod. The controller listener is advertised explicitly because
  # Kafka 3.9 in combined mode otherwise derives the meta-address 0.0.0.0 and refuses to start.
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@localhost:9093
    listeners=CLIENT://:9092,BROKER://:9095,CONTROLLER://:9093
    advertised.listeners=CLIENT://kafka.{{ $ns }}.svc.cluster.local:9092,BROKER://localhost:9095,CONTROLLER://localhost:9093
    listener.security.protocol.map=CLIENT:SASL_PLAINTEXT,BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
    inter.broker.listener.name=BROKER
    controller.listener.names=CONTROLLER
    sasl.enabled.mechanisms=SCRAM-SHA-512
    listener.name.client.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
    auto.create.topics.enable=false
    num.partitions={{ .Values.kafka.numPartitions }}
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    group.initial.rebalance.delay.ms=0
    log.dirs=/var/lib/kafka/data/kraft
  # The SCRAM user is written into the cluster metadata when the storage is first formatted. Changing the secret later
  # needs a fresh volume (kubectl delete pvc data-kafka-0): this broker is a disposable local stand-in.
  start.sh: |
    set -eu
    /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t "$CLUSTER_ID" -c /config/server.properties \
      --add-scram "SCRAM-SHA-512=[name=$KAFKA_SCRAM_USER,password=$KAFKA_SCRAM_PASSWORD]"
    exec /opt/kafka/bin/kafka-server-start.sh /config/server.properties
