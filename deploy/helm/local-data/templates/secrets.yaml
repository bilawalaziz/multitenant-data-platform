{{- /* PostgreSQL superuser: random, generated once, kept across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres-superuser" }}
{{- $password := .Values.postgres.superuser.password }}
{{- if not $password }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  labels:
    {{- include "ld.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  username: {{ .Values.postgres.superuser.name | quote }}
  password: {{ $password | quote }}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  labels:
    {{- include "ld.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.storeRef | nindent 4 }}
  target: {name: redis-auth, creationPolicy: Owner}
  data:
    - secretKey: password
      remoteRef: {key: {{ $es.prefix }}/redis/auth, property: auth_token}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-scram
  labels:
    {{- include "ld.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.storeRef | nindent 4 }}
  target: {name: kafka-scram, creationPolicy: Owner}
  data:
    - secretKey: username
      remoteRef: {key: {{ $es.prefix }}/kafka/app, property: username}
    - secretKey: password
      remoteRef: {key: {{ $es.prefix }}/kafka/app, property: password}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  labels:
    {{- include "ld.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
type: Opaque
stringData:
  password: {{ required "plainSecrets.redisPassword is required without External Secrets" .Values.plainSecrets.redisPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-scram
  labels:
    {{- include "ld.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka
type: Opaque
stringData:
  username: {{ .Values.plainSecrets.kafkaUsername | quote }}
  password: {{ required "plainSecrets.kafkaPassword is required without External Secrets" .Values.plainSecrets.kafkaPassword | quote }}
{{- end }}
