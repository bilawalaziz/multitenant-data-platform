apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "ld.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  selector:
    {{- include "ld.selector" (dict "root" . "name" "redis") | nindent 4 }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "ld.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "ld.selector" (dict "root" . "name" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ld.labels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          securityContext:
            {{- include "ld.containerSecurity" . | nindent 12 }}
          # AOF keeps rate limit state across a restart; volatile-ttl evicts only keys that expire, as in compose.
          command: ["sh", "-c"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" --maxmemory {{ .Values.redis.maxmemory }} --maxmemory-policy volatile-ttl
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-auth, key: password}}
            # redis-cli reads the password from here, which keeps it off the probe command line
            - name: REDISCLI_AUTH
              valueFrom: {secretKeyRef: {name: redis-auth, key: password}}
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
