{{/*
One Kubernetes Secret per entry of secretMap. With externalSecrets.enabled they are ExternalSecret objects; without,
plain Secrets from plainSecrets. The db-bootstrap Secret is a hook (see README, "Hook ordering") so that it exists
before the pre-install job; the others are ordinary release objects.
*/}}
{{- $es := .Values.externalSecrets }}
{{- range $component, $entries := .Values.secretMap }}
{{- $isHook := eq $component "dbBootstrap" }}
{{- if or (not $isHook) $.Values.dbBootstrap.enabled }}
{{- $name := include "sp.secretName" (dict "root" $ "component" (kebabcase $component)) }}
{{- $master := dict }}
{{- if and $isHook (not $.Values.dbBootstrap.master.existingSecret) }}
{{- $master = dict "MASTER_USER" (dict "key" $.Values.dbBootstrap.master.secretId "property" "username" "absolute" true) "MASTER_PASSWORD" (dict "key" $.Values.dbBootstrap.master.secretId "property" "password" "absolute" true) }}
{{- end }}
{{- $all := merge (deepCopy $entries) $master }}
---
{{- if $es.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
{{- else }}
apiVersion: v1
kind: Secret
type: Opaque
{{- end }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "sp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ kebabcase $component }}
  {{- if $isHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
{{- if $es.enabled }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.storeRef | nindent 4 }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    {{- range $env, $ref := $all }}
    {{- if and $isHook (hasPrefix "MASTER_" $env) (not $ref.key) }}
    {{- fail "dbBootstrap.master.secretId or dbBootstrap.master.existingSecret is required" }}
    {{- end }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ if $ref.absolute }}{{ $ref.key }}{{ else }}{{ printf "%s/%s" $es.prefix $ref.key }}{{ end }}
        property: {{ $ref.property }}
    {{- end }}
{{- else }}
stringData:
  {{- range $env, $ref := $all }}
  {{ $env }}: {{ required (printf "plainSecrets.%s is required when externalSecrets.enabled is false" $env) (index $.Values.plainSecrets $env) | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
