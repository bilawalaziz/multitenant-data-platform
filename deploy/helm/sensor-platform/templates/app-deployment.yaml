apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sp.fullname" . }}-app
  labels:
    {{- include "sp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sp.selector" (dict "root" . "component" "app") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      annotations:
        # Config changes roll the pods; secret rotation does not (ExternalSecrets refresh in place).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sp.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: {{ default (printf "%s-app" (include "sp.fullname" .)) .Values.app.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: {{ include "sp.image" (dict "root" . "image" .Values.image.app) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "sp.containerSecurity" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "sp.fullname" . }}-app
            - secretRef:
                name: {{ include "sp.secretName" (dict "root" . "component" "app") }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            {{- toYaml .Values.app.startupProbe | nindent 12 }}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            {{- toYaml .Values.app.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            {{- toYaml .Values.app.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            # The JVM and Tomcat write temporary files; everything else is read only.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
