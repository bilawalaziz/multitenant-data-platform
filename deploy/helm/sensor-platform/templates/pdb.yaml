{{- if .Values.app.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sp.fullname" . }}-app
  labels:
    {{- include "sp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  minAvailable: {{ .Values.app.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "sp.selector" (dict "root" . "component" "app") | nindent 6 }}
{{- end }}
