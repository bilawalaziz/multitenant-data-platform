apiVersion: v1
kind: Service
metadata:
  name: {{ include "sp.fullname" . }}-app
  labels:
    {{- include "sp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "sp.selector" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.app.service.apiPort }}, targetPort: http}
    # Probes and Prometheus scraping; the Ingress routes only the API port.
    - {name: management, port: {{ .Values.app.service.managementPort }}, targetPort: management}
