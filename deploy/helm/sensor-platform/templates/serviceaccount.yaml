{{- range $component := list "app" "consumer" }}
{{- $sa := (index $.Values $component).serviceAccount }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-%s" (include "sp.fullname" $) $component) $sa.name }}
  labels:
    {{- include "sp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The workloads never call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- end }}
