apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sp.fullname" . }}-app
  labels:
    {{- include "sp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
data:
  {{- with .Values.config.springProfiles }}
  SPRING_PROFILES_ACTIVE: {{ . | quote }}
  {{- end }}
  JAVA_OPTS: {{ .Values.config.javaOpts | quote }}
  DB_URL: {{ include "sp.jdbcUrl" . | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafka.bootstrapServers | quote }}
  KAFKA_SECURITY_PROTOCOL: {{ .Values.config.kafka.securityProtocol | quote }}
  KAFKA_SASL_MECHANISM: {{ .Values.config.kafka.saslMechanism | quote }}
  KAFKA_TOPIC_REPLICATION_FACTOR: {{ .Values.config.kafka.topicReplicationFactor | quote }}
  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_SSL: {{ .Values.config.redis.ssl | quote }}
  KEYCLOAK_ISSUER_URI: {{ .Values.config.keycloak.issuerUri | quote }}
  KEYCLOAK_JWK_SET_URI: {{ .Values.config.keycloak.jwkSetUri | quote }}
  KEYCLOAK_ADMIN_URL: {{ .Values.config.keycloak.adminUrl | quote }}
  PROVISIONER_CLIENT_ID: {{ .Values.config.keycloak.provisionerClientId | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.tracing.otlpEndpoint | quote }}
  TRACING_EXPORT_ENABLED: {{ .Values.config.tracing.exportEnabled | quote }}
  TRACING_SAMPLING_PROBABILITY: {{ .Values.config.tracing.samplingProbability | quote }}
  {{- range $k, $v := .Values.config.appEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sp.fullname" . }}-consumer
  labels:
    {{- include "sp.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafka.bootstrapServers | quote }}
  KAFKA_SECURITY_PROTOCOL: {{ .Values.config.kafka.securityProtocol | quote }}
  KAFKA_SASL_MECHANISM: {{ .Values.config.kafka.saslMechanism | quote }}
  GROUP_ID: {{ .Values.config.consumer.groupId | quote }}
  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_SSL: {{ .Values.config.redis.ssl | quote }}
  DEDUP_TTL_SECONDS: {{ .Values.config.consumer.dedupTtlSeconds | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.tracing.otlpEndpoint | quote }}
  OTEL_SERVICE_NAME: sensor-consumer
  {{- range $k, $v := .Values.config.consumerEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
