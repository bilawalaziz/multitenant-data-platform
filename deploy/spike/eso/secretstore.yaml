# Dummy static credentials: the emulator runs with --auth off and ignores them.
apiVersion: v1
kind: Secret
metadata:
  name: emulator-aws-creds
  namespace: default
stringData:
  access-key: test
  secret-key: test
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-emulator
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef: {name: emulator-aws-creds, key: access-key}
          secretAccessKeySecretRef: {name: emulator-aws-creds, key: secret-key}
