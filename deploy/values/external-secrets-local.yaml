# The D1 overlay (deploy/spike/eso/eso-values.yaml) for the AWS Emulator, whose certificate only names
# localhost/127.0.0.1: a socat sidecar exposes the emulator on the pod's own 127.0.0.1:9297, the endpoint overrides
# point there, and the emulator CA (ConfigMap emulator-ca from the eso-prereq release) verifies the certificate.
# The dummy credentials Secret (emulator-aws-creds) is created by the eso-config release.
extraEnv:
  - name: AWS_SECRETSMANAGER_ENDPOINT
    value: https://127.0.0.1:9297
  - name: AWS_STS_ENDPOINT
    value: https://127.0.0.1:9297
  - name: AWS_CA_BUNDLE
    value: /etc/emulator-ca/ca.pem
extraVolumes:
  - name: emulator-ca
    configMap:
      name: emulator-ca
extraVolumeMounts:
  - name: emulator-ca
    mountPath: /etc/emulator-ca
    readOnly: true
extraContainers:
  - name: emulator-tunnel
    image: alpine/socat:1.8.0.1
    args: ["TCP-LISTEN:9297,bind=127.0.0.1,fork,reuseaddr", "TCP:sensor-local-emulator:9297"]
    resources:
      requests: {cpu: 5m, memory: 8Mi}
      limits: {memory: 32Mi}
