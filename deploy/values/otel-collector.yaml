# opentelemetry-collector chart. The configuration of infra/otel-collector/config.yaml, with Tempo's service name.
# The application and the consumer send OTLP/HTTP to otel-collector.observability:4318.
fullnameOverride: otel-collector
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.165.0
command:
  name: otelcol-contrib

serviceAccount:
  create: true
  name: otel-collector
  automountServiceAccountToken: false

# Only OTLP is used; the chart's Jaeger and Zipkin ports stay closed.
ports:
  otlp: {enabled: true}
  otlp-http: {enabled: true}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}

config:
  receivers:
    jaeger: null
    prometheus: null
    zipkin: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    # Refuses data instead of being OOM-killed when the container's memory limit is near.
    memory_limiter:
      check_interval: 1s
      limit_mib: 160
      spike_limit_mib: 40
      # the chart's percentage defaults would apply next to the MiB limits
      limit_percentage: null
      spike_limit_percentage: null
    batch:
      timeout: 1s
  exporters:
    debug: null
    otlp/tempo:
      endpoint: tempo.observability:4317
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics: null
      logs: null

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
