# external-secrets chart 2.15.0 (the version proven in the D1 spike).
installCRDs: true

serviceAccount:
  create: true
  # Must match the Pod Identity association in deploy/terraform (namespace external-secrets).
  name: external-secrets

resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 192Mi}

webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}

certController:
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}
