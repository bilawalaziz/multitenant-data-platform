# No endpoint overrides, no CA, no sidecar: the controller authenticates with EKS Pod Identity through its service
# account (external-secrets/external-secrets, see values/external-secrets.yaml and the Terraform iam module). The
# service account carries no annotation because Pod Identity associates by name, not by IRSA role annotation.
replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
