# Multi-tenant sensor ingestion platform - local runtime. Values come from .env (see .env.example).
name: sensor-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sensor_platform}
      POSTGRES_USER: ${POSTGRES_USER:-sensor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 768m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # consumed by the realm import placeholders (DEMO_USER_PASSWORD etc.)
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set in .env}
      ALPHA_INGEST_CLIENT_SECRET: ${ALPHA_INGEST_CLIENT_SECRET:?set in .env}
      BETA_INGEST_CLIENT_SECRET: ${BETA_INGEST_CLIENT_SECRET:?set in .env}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/sensor-platform-realm.json:/opt/keycloak/data/import/sensor-platform-realm.json:ro
    healthcheck:
      # no curl in the image: raw HTTP over bash /dev/tcp against the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1024m

  app:
    build: .
    image: sensor-ingestion-platform:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sensor_platform}
      DB_USER: ${POSTGRES_USER:-sensor}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_HOST_PORT:-8180}/realms/sensor-platform
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/sensor-platform/protocol/openid-connect/certs
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Xss512k"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
      # management port for local diagnostics only
      - "127.0.0.1:8081:8081"
    mem_limit: 768m

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    mem_limit: 384m

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus
    mem_limit: 384m

  consumer:
    build: ./consumer
    image: sensor-consumer:local
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TOPICS: ${CONSUMER_TOPICS:-tenant-alpha.readings,tenant-beta.readings}
      GROUP_ID: ${CONSUMER_GROUP_ID:-sensor-readings-consumer}
      DEDUP_DB_PATH: /data/dedup.sqlite
    volumes:
      - consumer-data:/data
    restart: unless-stopped
    mem_limit: 192m

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  consumer-data:
